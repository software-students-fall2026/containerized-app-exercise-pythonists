<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Filler Word Coach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('pages.dashboard') }}">Filler Word Coach</a>
    <nav class="nav">
      <a href="{{ url_for('pages.dashboard') }}"
         class="{{ 'active' if request.endpoint == 'pages.dashboard' }}">Dashboard</a>
      <a href="{{ url_for('pages.record') }}"
         class="{{ 'active' if request.endpoint == 'pages.record' }}">Record</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
